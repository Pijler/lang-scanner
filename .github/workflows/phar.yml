name: Publish the released PHAR

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        required: true
        description: "Tag release version (e.g. v1.3.1)"

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest

    name: Release PHAR

    permissions:
      contents: write # upload the release asset
      id-token: write # sign the build provenance
      attestations: write

    steps:
      - name: Extract the tag version
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            GITHUB_REF="$INPUT_TAG"
          fi

          TAG="${GITHUB_REF##*v}"

          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid tag: $TAG"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - name: Setup PHP, with Composer and Extensions
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          tools: composer:v2
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --no-scripts

      - name: Audit Dependencies
        run: composer audit --locked

      - name: Create the PHAR file.
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: ./scanner app:build scanner.phar --build-version="$TAG"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: builds/scanner.phar

      - name: Upload the PHAR artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scanner.phar
          path: builds/scanner.phar

      - name: Upload the PHAR to release
        run: gh release upload "v${TAG}" builds/scanner.phar --repo "$GITHUB_REPOSITORY"
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
